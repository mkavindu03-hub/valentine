<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Kavindu ❤️ Tharani</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 22px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      max-width: 420px;
      width: 90%;
      position: relative;
      z-index: 2;
    }
    h1 {
      color: #e63946;
      margin-bottom: 10px;
    }
    p {
      color: #444;
      font-size: 18px;
      margin-bottom: 25px;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
      height: 60px;
    }
    button {
      padding: 14px 28px;
      font-size: 16px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      position: absolute;
    }
    button:hover {
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }
    .yes {
      background: #e63946;
      color: white;
      left: 50%;
      transform: translateX(-120%);
    }
    .no {
      background: #ddd;
      color: #555;
      left: 50%;
      transform: translateX(20%);
    }
    .love {
      font-size: 38px;
      margin-top: 25px;
      display: none;
      color: #e63946;
    }
    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .heart {
      position: absolute;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
      opacity: 0.8;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) scale(1); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }
    iframe {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Background music (YouTube embed) -->
  <iframe
    src="https://www.youtube.com/embed/nSDgHBxUbVQ?autoplay=1&mute=1"
    allow="autoplay">
  </iframe>

  <div class="hearts" id="hearts"></div>

  <div class="card">
    <h1>💖 Tharani 💖</h1>
    <p>
      From Kavindu ❤️<br><br>
      Every moment with you feels like a memory worth keeping forever.<br>
      So I just want to ask…
    </p>

    <h2>Will you be my Valentine? 💘</h2>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💕</button>
      <button class="no" id="noBtn">No 🙈</button>
    </div>

    <div class="love" id="love">
      🥰 I knew it, Tharani! 💍💖
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");

    function moveNo() {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("touchstart", moveNo);

    function sayYes() {
      document.getElementById("love").style.display = "block";
      createHearts();
      // unmute music after interaction
      document.querySelector("iframe").src =
        "https://www.youtube.com/embed/nSDgHBxUbVQ?autoplay=1";
    }

    function createHearts() {
      const hearts = document.getElementById("hearts");
      for (let i = 0; i < 30; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
        hearts.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
      }
    }
  </script>
</body>
</html>
